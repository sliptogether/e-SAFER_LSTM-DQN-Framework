[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-safer-lstm-dqn"
version = "0.1.0"
description = "e-SAFER: LSTM sweat-signal forecasting and surrogate DQN exercise-intensity recommendations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "torch>=2.2",
    "matplotlib>=3.8",
    "gymnasium>=0.29",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

