# SYNTHETIC SOFTWARE DEMO ONLY. Not the manuscript training configuration.
# Tiny search and short training validate the pipeline, not scientific performance.
project:
  seed: 2026
  device: cpu
paths:
  raw_dir: data/synthetic
  output_dir: outputs_synthetic
data:
  features:
  - Na
  - K
  - Ca
  - TEMP
  - FR
  sheet_map:
    Day1:
      TEMP: TEMP-10
      Na: Na
      K: K
      Ca: Ca
      FR: FR
      HR: HR-10
    Day2:
      TEMP: TEMP
      Na: Na
      K: K
      Ca: Ca
      FR: FR
      HR: HR
    Day3:
      TEMP: TEMP
      Na: Na
      K: K
      Ca: Ca
      FR: FR
      HR: HR
    Day4:
      TEMP: TEMP10
      Na: Na10
      K: K10
      Ca: Ca10
      FR: FR
      HR: HR
  minute_start: 6
  minute_end: 55
  prediction_start_min: 10
  input_length_min: 5
  forecast_horizon_min: 5
  forecast_origins:
  - 10
  - 20
  - 30
  - 40
  - 50
  denoise:
    Na:
      method: holt
      alpha: 0.1
      beta: 0.1
      keep_raw: true
    K:
      method: holt
      alpha: 0.1
      beta: 0.1
      keep_raw: true
    Ca:
      method: holt
      alpha: 0.1
      beta: 0.05
      keep_raw: true
    TEMP:
      method: holt
      alpha: 0.1
      beta: 0.1
      keep_raw: true
    FR:
      method: holt
      alpha: 0.1
      beta: 0.1
      keep_raw: true
model:
  candidate_modes:
  - rel
  candidate_hidden:
  - 4
  candidate_summary_loss_weight:
  - 0.1
  candidate_use_all_features:
  - true
  candidate_include_hr:
  - false
  candidate_include_time:
  - true
  candidate_trend_skip:
  - false
  candidate_persistence_blend:
  - 0.0
  - 0.5
  epochs: 3
  learning_rate: 0.005
  weight_decay: 0.0001
  ensemble_seeds:
  - 101
  - 202
  early_stopping:
    enabled: true
    validation_day: 3
    monitor: trajectory_loss
    patience: 2
    min_delta: 0.0001
    min_epochs: 1
selection:
  trajectory_r2_weight: 1.0
  trend_accuracy_weight: 0.1
  summary_nrmse_weight: 0.05
  stable_threshold_multiplier: 2.0
figures:
  prediction_targets:
  - Na
  - K
  - Ca
  - FR
  prediction_origin: 20
reporting:
  include_protocol_surrogate: false
rolling_forecast:
  enabled: true
  start_minute: 10
  end_origin_minute: 55
rl_state:
  include_observed_cumulative_slope: true
  use_rolling_predictions: true
  decision_start_minute: 10
  decision_end_minute: 55
rl_demo:
  episodes: 8
  gamma: 0.95
  lr: 0.001
  batch_size: 32
  replay_size: 5000
  target_update: 2
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.985
  action_effect:
    reduce:
      HR: -0.15
      TEMP: -0.08
      FR: -0.1
    maintain:
      HR: 0.0
      TEMP: 0.0
      FR: 0.0
    increase:
      HR: 0.15
      TEMP: 0.08
      FR: 0.1
  reward:
    future_risk_weight: 1.0
    uncertainty_weight: 0.25
    action_change_penalty: 0.1
    hr_quantiles:
    - 0.25
    - 0.75
protocol_surrogate:
  response_strength: 1.0
  response_decay: 0.5
  delta_weight: 1.0
  mean_delta_weight: 0.5
  slope_weight: 0.35
  uncertainty_weight: 0.25
synthetic_data: true
